[project]
name = "dungeon-browser-alison"
version = "0.1.0"
description = "Retro pixel-art escape-room RPG built with Pyxel"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyxel>=2.0",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.uv]
package = false

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]
